version: 2

updates:
  # The actions used by ci.yml, release.yml and docs.yml.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      # This repo's commits are one imperative sentence with no prefix.
      prefix: "Update"

  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "Update"
    groups:
      # One PR for the routine patch/minor churn; majors stay separate so
      # they get read.
      go-minor-and-patch:
        update-types: [minor, patch]
