name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    # The gates run through `just ci`, so a developer and CI cannot
    # disagree about what "passing" means. No untrusted input reaches any
    # run: block, so the github.event.* injection class does not apply.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # The floor from go.mod, the toolchain the release is built with,
        # and the newest Go release.
        go-version: ['1.25', '1.26', '1.27']

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          # `just version` and the docs' git-revision plugin need history.
          fetch-depth: 0

      - name: setup-go
        uses: actions/setup-go@v5
        with:
          # check-latest: without it setup-go takes the newest patch the
          # runner image has cached (1.26.8 when 1.26.9 fixed 11 CVEs in
          # the standard library) instead of the newest release.
          go-version: ${{ matrix.go-version }}
          check-latest: true
          cache: true

      - name: setup-just
        uses: extractions/setup-just@v4

      - name: setup-uv
        uses: astral-sh/setup-uv@v5

      - name: install ripgrep (ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: install ripgrep (macos)
        if: runner.os == 'macOS'
        run: brew install ripgrep

      # v2.x: the repo's .golangci.yml uses the v2 config schema, and the
      # binary must be built with a Go at least as new as go.mod's
      # directive or it refuses to run. It must also read the export data
      # of the newest Go in the matrix: v2.13.2 cannot read Go 1.27.2's
      # and fails every package with a typecheck error; v2.14.0 can, and
      # finds 0 issues on 1.25, 1.26 and 1.27. install-only: the action
      # puts the binary on PATH and runs nothing; `just ci` runs the lint
      # itself.
      - name: install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          install-mode: binary
          install-only: true

      - name: just ci
        run: just ci

      - name: coverage floor
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.26'
        run: just cover

      - name: upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.26'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: cover.out

  security:
    # Kept out of the CI job so a CVE disclosure does not block merging a
    # fix for it, and so the gate stays readable.
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup-go
        uses: actions/setup-go@v5
        with:
          # check-latest: without it setup-go takes the newest patch the
          # runner image has cached (1.26.8 when 1.26.9 fixed 11 CVEs in
          # the standard library) instead of the newest release.
          go-version: '1.26'
          check-latest: true

      - name: setup-just
        uses: extractions/setup-just@v4

      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: just vuln
        run: just vuln
