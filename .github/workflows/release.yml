name: Release

# Build the release binaries when a vX.Y.Z tag is pushed. scripts/release.sh
# creates the tag locally and prints the push command; nothing here runs
# until a human pushes it. A pushed tag whose name is not exactly vX.Y.Z
# stops the job at its first step, before anything is checked out or run.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write # create the GitHub Release and upload the binaries

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Later steps hand the tag name to the justfile: the build stamps it
      # as the version, and the release notes step passes its version.
      # git allows a quote, `;`, `$(` or a backtick in a tag name, and the
      # `v*.*.*` filter above lets such a name through, so the job stops
      # here unless the name is exactly vX.Y.Z. The name is read from the
      # environment, never pasted into the script, so this check runs no
      # part of it.
      - name: check the tag name
        shell: bash
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'ERROR: the tag name %q is not vX.Y.Z; nothing is built or released\n' "$GITHUB_REF_NAME"
            exit 1
          fi
          printf 'tag name %s is vX.Y.Z\n' "$GITHUB_REF_NAME"

      - name: checkout
        uses: actions/checkout@v4

      - name: setup-go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: setup-just
        uses: extractions/setup-just@v4

      # The binaries stamp the tag this job was started for, which the
      # first step checked. `git describe`, the justfile's default
      # version, prints an annotated tag in preference to the lightweight
      # one scripts/release.sh makes: another tag on the release commit
      # would be stamped in its place.
      - name: build binaries and checksums
        shell: bash
        run: just --set version "$GITHUB_REF_NAME" build-all

      # The stamped version must be the tag itself: a version that only
      # contains the tag name, such as another tag that ends in it, fails.
      - name: verify the binary reports the tag
        shell: bash
        run: |
          set -euo pipefail
          reported=$(./dist/rx-linux-amd64 --version)
          echo "rx --version: $reported"
          if [[ "$reported" != "rx version $GITHUB_REF_NAME" ]]; then
            echo "ERROR: rx --version ($reported) is not exactly: rx version $GITHUB_REF_NAME"
            exit 1
          fi

      - name: release notes
        id: notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          just release-notes "$version" > release-notes.md
          echo "Release notes for $version:"
          cat release-notes.md

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/rx-*
          body_path: release-notes.md
          fail_on_unmatched_files: true
