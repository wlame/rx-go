name: Release

# Build the release binaries when a vX.Y.Z tag is pushed. scripts/release.sh
# creates the tag locally and prints the push command; nothing here runs
# until a human pushes it. A pushed tag whose name is not exactly vX.Y.Z
# stops the job at its first step, before anything is checked out or run.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write # create the GitHub Release and upload the binaries

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Later steps hand the tag name to the justfile: the release notes
      # step passes its version, and `git describe` gives it to the build
      # as the version it stamps. git allows a quote, `;`, `$(` or a
      # backtick in a tag name, and the `v*.*.*` filter above lets such a
      # name through, so the job stops here unless the name is exactly
      # vX.Y.Z. The name is read from the environment, never pasted into
      # the script, so this check runs no part of it.
      - name: check the tag name
        shell: bash
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'ERROR: the tag name %q is not vX.Y.Z; nothing is built or released\n' "$GITHUB_REF_NAME"
            exit 1
          fi
          printf 'tag name %s is vX.Y.Z\n' "$GITHUB_REF_NAME"

      - name: checkout
        uses: actions/checkout@v4
        with:
          # The build stamps `git describe`, which needs the tag history.
          fetch-depth: 0

      - name: setup-go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: setup-just
        uses: extractions/setup-just@v4

      - name: build binaries and checksums
        run: just build-all

      - name: verify the binary reports the tag
        run: |
          set -euo pipefail
          reported=$(./dist/rx-linux-amd64 --version)
          echo "rx --version: $reported"
          case "$reported" in
            *"${GITHUB_REF_NAME}"*) ;;
            *)
              echo "ERROR: rx --version ($reported) does not carry the tag ${GITHUB_REF_NAME}"
              exit 1
              ;;
          esac

      - name: release notes
        id: notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          just release-notes "$version" > release-notes.md
          echo "Release notes for $version:"
          cat release-notes.md

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/rx-*
          body_path: release-notes.md
          fail_on_unmatched_files: true
