# Built-in signatures of the secret group. Every one is redacted: the
# value is masked in every output and never written to the cache.
signatures:
  - id: aws-access-key
    name: AWS access key ID
    group: secret
    tags: [aws, cloud]
    level: high
    redact: true
    description: |
      An AWS access key ID: a four-character prefix that names the kind
      of key (AKIA for a long-term key, ASIA for a temporary one) and
      sixteen more characters.
    links: [https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_identifiers.html]
    regex: '\b(?:A3T[A-Z0-9]|AKIA|ASIA|ABIA|ACCA)[A-Z2-7]{16}\b'
    examples:
      match:
        - export AWS_ACCESS_KEY_ID=AKIAIOSFODNN7EXAMPLE
      no_match:
        - user AKIA1234 logged in
