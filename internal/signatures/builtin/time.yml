  - id: time-gap
    name: Silence in the log
    group: time
    tags: [gap]
    level: low
    description: |
      A silence: at least a minute, and at least 50 times the median
      interval between stamped lines, with no stamped line. The finding
      is the line before the silence and the first stamped line after
      it. A log that only writes when something happens has many.
    links:
      - https://www.elastic.co/guide/en/machine-learning/current/ml-count-functions.html
    measure: {name: time-gap}
    examples:
      match:
        - |
          2026-03-01 10:00:00 INFO tick 1
          2026-03-01 10:00:01 INFO tick 2
          2026-03-01 10:00:02 INFO tick 3
          2026-03-01 10:00:03 INFO tick 4
          2026-03-01 10:00:04 INFO tick 5
          2026-03-01 10:10:04 INFO tick 6
      no_match:
        - |
          2026-03-01 10:00:00 INFO tick 1
          2026-03-01 10:00:01 INFO tick 2
          2026-03-01 10:00:02 INFO tick 3
          2026-03-01 10:00:03 INFO tick 4
          2026-03-01 10:00:04 INFO tick 5
          2026-03-01 10:00:05 INFO tick 6

  - id: time-backwards
    name: Timestamp going backwards
    group: time
    tags: [clock]
    level: low
    description: |
      A line stamped more than a second earlier than the stamped line
      before it: a clock step, two writers with different clocks, or
      records merged out of order. Small steps back from concurrent
      writers are within the tolerance.
    links:
      - https://docs.lnav.org/en/latest/formats.html
    measure: {name: time-backwards}
    examples:
      match:
        - |
          2026-03-01 10:00:00 INFO tick 1
          2026-03-01 10:00:01 INFO tick 2
          2026-03-01 10:00:02 INFO tick 3
          2026-03-01 09:59:00 INFO tick 4
      no_match:
        - |
          2026-03-01 10:00:00.000 INFO tick 1
          2026-03-01 10:00:01.000 INFO tick 2
          2026-03-01 10:00:02.000 INFO tick 3
          2026-03-01 10:00:01.500 INFO tick 4
