# Built-in signatures of the time group: the timing of a log's lines,
# read with the timestamp format rx detects in the file. A file without
# a timestamp format gives none of these findings. Their examples are
# invented.
signatures:
  - id: log-burst
    name: Burst of log lines
    group: time
    tags: [density]
    level: medium
    description: |
      A burst of lines: consecutive time buckets that each hold at least
      five times the median number of lines per bucket, a modified
      z-score over 3.5 and at least 100 lines. The bucket size is chosen
      for about 1,000 buckets over the file's time span. The counts per
      bucket are kept with the findings, for a density chart.
    links:
      - https://www.itl.nist.gov/div898/handbook/eda/section3/eda35h.htm
      - https://www.elastic.co/guide/en/machine-learning/current/ml-count-functions.html
    measure: {name: density}
    examples:
      match:
        - |
          2026-03-01 10:00:00 INFO tick 0
          2026-03-01 10:00:01 INFO tick 1
          2026-03-01 10:00:02 INFO tick 2
          2026-03-01 10:00:03 INFO tick 3
